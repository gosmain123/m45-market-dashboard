name: Refresh market dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'site/data/dashboard.json'
  schedule:
    # Singapore time:
    # 06:30 SGT Mon-Fri (22:30 UTC Sun-Thu)
    - cron: "30 22 * * 0-4"
    # 08:30 SGT Mon-Fri
    - cron: "30 0 * * 1-5"
    # 11:30 SGT Mon-Fri
    - cron: "30 3 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard snapshot
        run: python scripts/build_dashboard.py

      - name: Run calculation tests
        run: pytest -q

      - name: Commit refreshed snapshot
        run: |
          git config user.name "m45-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/dashboard.json
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "data: refresh dashboard"
            git push
          fi
