name: Refresh market dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'site/data/dashboard.json'
  schedule:
    # Singapore time:
    # 06:30 SGT Mon-Fri (22:30 UTC Sun-Thu)
    - cron: "30 22 * * 0-4"
    # 08:30 SGT Mon-Fri
    - cron: "30 0 * * 1-5"
    # 11:30 SGT Mon-Fri
    - cron: "30 3 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-dashboard-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard snapshot
        run: python scripts/build_dashboard.py

      - name: Run calculation tests
        run: pytest -q

      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('site/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',html,re.S)
          if not m:
              raise SystemExit('script tag not found')
          Path('/tmp/dashboard.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/dashboard.js

      - name: Run dashboard critical-data QA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('site/data/dashboard.json').read_text())
          missing=[]
          checks=[
            ('S&P 500', d.get('market',{}).get('spx',{}).get('price')),
            ('Nasdaq', d.get('market',{}).get('nasdaq',{}).get('price')),
            ('SOX', d.get('market',{}).get('sox',{}).get('price')),
            ('DXY', d.get('market',{}).get('dxy',{}).get('price')),
            ('Brent', d.get('market',{}).get('brent',{}).get('price')),
            ('Gold', d.get('market',{}).get('gold',{}).get('price')),
            ('2Y Treasury', d.get('curve',{}).get('2Y',{}).get('yield')),
            ('10Y Treasury', d.get('curve',{}).get('10Y',{}).get('yield')),
            ('30Y Treasury', d.get('curve',{}).get('30Y',{}).get('yield')),
            ('10Y real yield', d.get('fred',{}).get('real10',{}).get('value')),
            ('ACM term premium', d.get('acm',{}).get('tp10')),
            ('Treasury CVOL', d.get('cvol',{}).get('value')),
            ('FedWatch', bool(d.get('fedwatch',{}).get('probabilities'))),
            ('HY vs IG proxy', d.get('credit_proxy',{}).get('hy_vs_ig',{}).get('1d')),
            ('Macro calendar', len(d.get('calendar',[]))>0),
          ]
          for name,val in checks:
              if val is None or val is False:
                  missing.append(name)
          if missing:
              raise SystemExit('Critical dashboard fields missing: '+', '.join(missing))
          core=d.get('core_tape',[])
          val_count=sum(1 for r in core if (r.get('valuation') or {}).get('metric') not in (None,'N/M'))
          if val_count < max(20, int(len(core)*0.70)):
              raise SystemExit(f'Valuation coverage too low: {val_count}/{len(core)} core names')

          horizon_fields=('1d','1w','1m','3m','6m','1y','3y','5y')
          long_missing=[]
          for key,row in d.get('market',{}).items():
              for field in horizon_fields:
                  if row.get(field) is None:
                      long_missing.append(f'market.{key}.{field}')
          for bucket in ('sectors','factors'):
              for row in d.get(bucket,[]):
                  for field in horizon_fields:
                      if row.get(field) is None:
                          long_missing.append(f'{bucket}.{row.get("symbol")}.{field}')
          for row in d.get('signals',[]):
              for field in ('1m','3m','6m','1y','3y','5y'):
                  if row.get(field) is None:
                      long_missing.append(f'signals.{row.get("symbol")}.{field}')
          if long_missing:
              raise SystemExit('Long-horizon dashboard gaps: '+', '.join(long_missing[:30]))

          print(f'Critical dashboard QA passed; valuation coverage {val_count}/{len(core)}; long-horizon tables complete')
          PY

      - name: Commit refreshed snapshot
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          cp site/data/dashboard.json /tmp/dashboard.json
          git fetch origin main

          CHANGED="$(git diff --name-only "$GITHUB_SHA" origin/main || true)"
          if [ -n "$CHANGED" ] && [ "$CHANGED" != "site/data/dashboard.json" ]; then
            echo "A newer code commit exists; skip publishing this snapshot. The newer workflow run will publish it."
            echo "$CHANGED"
            exit 0
          fi

          git reset --hard origin/main
          cp /tmp/dashboard.json site/data/dashboard.json
          git add site/data/dashboard.json

          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "data: refresh dashboard"
            git push origin HEAD:main
          fi
